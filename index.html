<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabañas Laguna Verde - Portal Turístico</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="top-bar py-2 bg-light border-bottom d-none d-md-block">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="social-icons">
                <a href="#" class="text-secondary me-3"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-secondary me-3"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-secondary"><i class="bi bi-envelope-fill"></i></a>
            </div>
            <div class="top-links fs-7">
                <a href="#" class="text-secondary me-3 text-decoration-none">Ingresar</a>
                <a href="#" class="text-secondary me-3 text-decoration-none">Registrate</a>
                <a href="#" class="btn btn-teal btn-sm text-white fw-bold"><i class="bi bi-plus-circle"></i> Reservar Cabaña</a>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 shadow-sm">
        <div class="container d-flex flex-column align-items-center">
            <a class="navbar-brand mb-3" href="#">
                <span class="fw-bold text-teal tracking-wide fs-3">LAGUNAVERDE<span class="text-dark">.COM</span></span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav text-center nav-iconos">
                    <li class="nav-item mx-2">
                        <a class="nav-link active" href="#">
                            <i class="bi bi-house-door d-block fs-4 text-teal"></i>
                            <span class="fs-7 tracking-tight">ALOJAMIENTOS</span>
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link" href="#">
                            <i class="bi bi-compass d-block fs-4 text-teal"></i>
                            <span class="fs-7 tracking-tight">AVENTURAS</span>
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link" href="#">
                            <i class="bi bi-tree d-block fs-4 text-teal"></i>
                            <span class="fs-7 tracking-tight">AIRE LIBRE</span>
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link" href="#resenas">
                            <i class="bi bi-chat-square-heart d-block fs-4 text-teal"></i>
                            <span class="fs-7 tracking-tight">RESEÑAS</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-premium d-flex align-items-center text-center text-white">
        <div class="container">
            <h1 class="display-4 fw-bold mb-2">Santuario de la Naturaleza</h1>
            <p class="lead mb-4 fs-5">Cabañas con tinajas, desconexión total y la magia de la Quinta Región.</p>
            <a href="#" class="btn btn-outline-white px-4 py-2 text-uppercase fw-bold fs-7">Visitar</a>
        </div>
    </header>

    <div class="container contenedor-buscador">
        <div class="bg-white shadow p-4 rounded-4 border">
            <div class="row align-items-center g-3">
                <div class="col-md-5">
                    <label class="form-label text-muted fw-bold small">¿Dónde buscas?</label>
                    <select id="select-sector" class="form-select border-0 bg-light py-2">
                        <option value="todos">Todos los sectores de Laguna Verde...</option>
                        <option value="playa">Cerca de la Playa</option>
                        <option value="bosque">Sector El Bosque / Acantilados</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label text-muted fw-bold small">Servicios Adicionales</label>
                    <select id="select-servicio" class="form-select border-0 bg-light py-2">
                        <option value="todos">Cualquier comodidad...</option>
                        <option value="tinaja">Con Tinaja Caliente</option>
                        <option value="mascotas">Pet Friendly (Mascotas)</option>
                    </select>
                </div>
                <div class="col-md-2 text-end">
                    <label class="form-label d-none d-md-block">&nbsp;</label>
                    <button id="btn-buscar" class="btn btn-teal w-100 py-2 text-white">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <section id="resenas" class="py-5 bg-light target-section">
        <div class="container">
            <h3 class="text-center mb-5 fw-bold text-secondary">Opiniones de nuestros Huéspedes</h3>
            <div id="contenedor-resenas" class="row g-4">
                </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="jss/script.js"></script>
</body>
</html>
